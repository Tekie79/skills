name: Validate agent skills
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate all skill metadata and links
        run: python scripts/skills.py validate
      - name: Test scaffold and validator
        run: python -m unittest discover -s tests -v
